services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: onboarding
      POSTGRES_PASSWORD: onboarding
      POSTGRES_DB: onboarding
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onboarding"]
      interval: 5s
      retries: 10
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db: { condition: service_healthy }
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg2://onboarding:onboarding@db:5432/onboarding
    ports: ["8000:8000"]
    volumes: [uploads:/data/storage]
volumes:
  pgdata:
  uploads:
